<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>

<nav aria-label="주 메뉴" style="display: flex; align-self: flex-end; align-items: flex-end; gap: 4px; margin-bottom: -3px">

<a href="Items.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 7px; height: 45px; padding: 0 18px; box-sizing: border-box; border-radius: 8px 8px 0 0; border: 3px solid #2A2A33; border-bottom: 0; background: #F3EFE6; color: #D8322B; text-decoration: none; font-family: 'Do Hyeon',sans-serif; font-size: 18px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>아이템</a>
<a href="Squad.dc.html" style="display: flex; align-items: center; gap: 7px; height: 38px; margin-bottom: 3px; padding: 0 16px; box-sizing: border-box; border-radius: 8px 8px 0 0; background: #B8241D; color: #FFFFFF; text-decoration: none; font-family: 'Do Hyeon',sans-serif; font-size: 18px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"></path><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"></path></svg>스쿼드</a>

<label style="display: flex; align-items: center; gap: 8px; width: 280px; height: 36px; padding: 0 10px; box-sizing: border-box; border-radius: 6px; border: 2px solid #2A2A33; background: #FFFFFF; color: #6B6872"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg><input aria-label="전체 검색" placeholder="포켓몬 · 기술 · 아이템 검색" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; color: #22222A; font-family: inherit; font-size: 13px; outline: none"><span style="font-family: 'Nanum Gothic Coding',monospace; font-size: 11px; padding: 1px 5px; border: 1.5px solid #BDB4A3; border-radius: 3px; white-space: nowrap">Ctrl K</span></label>

<div style="display: flex; align-items: center; height: 38px; flex: none; padding: 0 14px; background: #2A7D38; border-bottom: 2px solid #2A2A33; color: #FFFFFF"><h2 style="margin: 0; font-family: 'Do Hyeon',sans-serif; font-size: 20px; font-weight: 400">분류</h2></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button aria-pressed="{{c.on}}" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px; box-sizing: border-box; border-radius: 6px; font-family: 'Do Hyeon',sans-serif; font-size: 18px; color: #22222A; text-align: left; border: {{c.bd}}; background: {{c.bg}}">
<span style="width: 12px; display: flex; justify-content: center"><sc-if value="{{c.on}}" hint-placeholder-val="{{false}}"><span style="width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid #2A2A33"></span></sc-if></span>
<span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 4px; border: 1.5px solid #2A2A33; background: {{c.sw}}"></span>
{{c.name}}</button>

</div>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding: 14px; border-top: 2px dashed #DDD6C8">

</div>
</aside>

<main style="display: flex; flex-direction: column; min-width: 0; min-height: 0; border-radius: 8px; border: 2px solid #2A2A33; background: #FFFFFF; box-shadow: 0 3px 0 #2A2A33; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; height: 38px; flex: none; padding: 0 14px; background: #D8322B; border-bottom: 2px solid #2A2A33; color: #FFFFFF">
<h1 style="margin: 0; font-family: 'Do Hyeon',sans-serif; font-size: 20px; font-weight: 400">아이템 대백과</h1>
<span style="font-size: 13px; font-weight: 800">진화 · 19개</span>
</div>
<div style="display: flex; align-items: center; gap: 10px; height: 52px; flex: none; padding: 0 12px; border-bottom: 1px solid #EFEAE0">
<label style="display: flex; align-items: center; gap: 8px; flex-grow: 1; height: 34px; padding: 0 10px; box-sizing: border-box; border-radius: 6px; border: 2px solid #2A2A33; background: #FFFFFF; color: #6B6872"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg><input aria-label="아이템 검색" placeholder="이름 · 효과 검색" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; color: #22222A; font-family: inherit; font-size: 13px; outline: none"></label>
<button style="display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px; border-radius: 6px; border: 2px solid #2A2A33; background: #FFFFFF; color: #22222A; font-family: inherit; font-size: 12px; font-weight: 800">가나다순<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; padding: 0 12px; min-height: 0">
<div style="display: grid; grid-template-columns: 18px 28px 112px 1fr 178px; gap: 10px; align-items: center; height: 30px; border-bottom: 2px solid #2A2A33; font-size: 11px; font-weight: 800; color: #55535C">
<span></span><span></span><span>이름</span><span>효과</span>
<span style="display: grid; grid-template-columns: repeat(9, 18px); gap: 2px; text-align: center"><sc-for list="{{genHead}}" as="h" hint-placeholder-count="9"><span style="border-radius: 3px; background: {{h.bg}}">{{h.n}}</span></sc-for></span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="19">
<div style="display: grid; grid-template-columns: 18px 28px 112px 1fr 178px; gap: 10px; align-items: center; height: 34px; border-bottom: 1px solid #EFEAE0; background: {{r.bg}}; opacity: {{r.op}}">
<span style="display: flex; justify-content: center"><sc-if value="{{r.sel}}" hint-placeholder-val="{{false}}"><span style="width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid #2A2A33"></span></sc-if></span>
<span style="width: 26px; height: 26px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 13px; border: 1.5px solid #BDB4A3; background: #FAF7F0"><span style="width: 8px; height: 8px; transform: rotate(45deg); background: #DDD6C8"></span></span>
<span style="font-size: 13px; font-weight: 800; white-space: nowrap">{{r.name}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #55535C; white-space: nowrap; overflow: hidden">{{r.fx}}<sc-if value="{{r.absent}}" hint-placeholder-val="{{false}}"><span style="font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 3px; border: 1.5px dashed #9A96A0; color: #6B6872">4세대 없음</span></sc-if></span>
<span style="display: grid; grid-template-columns: repeat(9, 18px); gap: 2px">
<sc-for list="{{r.g}}" as="c" hint-placeholder-count="9"><span style="height: 16px; box-sizing: border-box; border-radius: 3px; border: {{c.bd}}; background: {{c.bg}}"></span></sc-for>
</span>
</div>
</sc-for>
</div>
</main>

<aside aria-label="선택한 아이템 상세" style="display: flex; flex-direction: column; min-height: 0; border-radius: 8px; border: 2px solid #2A2A33; background: #FFFFFF; box-shadow: 0 3px 0 #2A2A33; overflow: hidden">
<div style="display: flex; align-items: center; height: 38px; flex: none; padding: 0 14px; background: #2C64B0; border-bottom: 2px solid #2A2A33; color: #FFFFFF"><h2 style="margin: 0; font-family: 'Do Hyeon',sans-serif; font-size: 21px; font-weight: 400">각성의돌</h2></div>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 16px">
<div style="display: flex; gap: 14px; align-items: center">
<div style="width: 76px; height: 76px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 38px; border: 2px solid #2A2A33; background: repeating-linear-gradient(135deg, #FAF7F0 0px, #FAF7F0 6px, #F3EFE6 6px, #F3EFE6 12px)"><span style="font-size: 11px; font-weight: 700; color: #6B6872">[아이콘]</span></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="align-self: flex-start; display: flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 11px; border: 2px solid #2A2A33; background: #2A7D38; color: #FFFFFF; font-size: 12px; font-weight: 800">진화</span>
<span style="font-size: 12px; color: #55535C">4세대에 처음 등장</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Do Hyeon',sans-serif; font-size: 17px">세대별 존재</span>
<div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{selGens}}" as="g" hint-placeholder-count="9">
<div style="display: flex; flex-direction: column; align-items: center; gap: 3px">
<span style="width: 100%; height: 26px; box-sizing: border-box; border-radius: 4px; border: {{g.bd}}; background: {{g.bg}}"></span>
<span style="font-family: 'Silkscreen',monospace; font-size: 11px; font-weight: 400; color: {{g.fg}}">{{g.n}}</span>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Do Hyeon',sans-serif; font-size: 17px">효과</span>
<p style="margin: 0; padding: 12px; border-radius: 6px; border: 2px solid #2A2A33; background: #FAF7F0; font-size: 14px; line-height: 21px">특정 포켓몬에게 사용하면 진화한다.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Do Hyeon',sans-serif; font-size: 17px">진화 대상</span>
<div style="display: grid; grid-template-columns: 1fr 20px 1fr; gap: 6px 8px; align-items: center">
<a href="Dex.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 10px; border-radius: 6px; border: 1.5px solid #DDD6C8; font-size: 13px; font-weight: 800; color: #22222A; text-decoration: none">킬리아 <span style="font-weight: 400; color: #6B6872; margin-left: 4px">수컷</span></a>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2A33" stroke-width="2.6"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
<a href="Dex.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 10px; border-radius: 6px; border: 2px solid #2A2A33; background: #FFF4CC; font-size: 13px; font-weight: 800; color: #22222A; text-decoration: none">엘레이드</a>
<a href="Dex.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 10px; border-radius: 6px; border: 1.5px solid #DDD6C8; font-size: 13px; font-weight: 800; color: #22222A; text-decoration: none">눈꼬마 <span style="font-weight: 400; color: #6B6872; margin-left: 4px">암컷</span></a>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2A33" stroke-width="2.6"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
<a href="Dex.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 10px; border-radius: 6px; border: 2px solid #2A2A33; background: #FFF4CC; font-size: 13px; font-weight: 800; color: #22222A; text-decoration: none">눈여아</a>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Do Hyeon',sans-serif; font-size: 17px">입수처 · 4세대</span>
<div style="padding: 12px; border-radius: 6px; border: 1.5px dashed #9A96A0; font-size: 13px; color: #6B6872">[게임별 입수처 데이터 연결 후 표시]</div>
</div>
</div>
</aside>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const cats = [['전체', '#FFFFFF'], ['회복', '#E86A4F'], ['기술머신', '#2C64B0'], ['진화', '#2A7D38'], ['배틀', '#D8322B'], ['기타', '#BDBBA6']].map(([name, sw], i) => ({
      name, sw, on: i === 3,
      bd: i === 3 ? '2px solid #2A2A33' : '2px solid transparent', bg: i === 3 ? '#FFF4CC' : 'transparent'
    }));
    const CUR = 4;
    const genHead = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => ({ n, bg: n === CUR ? '#F2C12E' : 'transparent' }));
    const stone = '특정 포켓몬에게 사용하면 진화한다';
    const trade = '지닌 채 통신교환하면 진화한다';
    const raw = [
      ['불꽃의돌', stone, 1], ['물의돌', stone, 1], ['천둥의돌', stone, 1], ['리프의돌', stone, 1], ['달의돌', stone, 1],
      ['태양의돌', stone, 2], ['빛의돌', stone, 4], ['어둠의돌', stone, 4], ['각성의돌', stone, 4], ['얼음의돌', stone, 7],
      ['금속코트', trade + ' · 강철 기술 강화', 2], ['용의비늘', trade, 2], ['업그레이드', trade, 2],
      ['괴상한패치', trade, 4], ['일렉트어라이저', trade, 4], ['마그마부스터', trade, 4],
      ['예리한손톱', '밤에 지닌 채 레벨업하면 진화 · 급소율 상승', 4], ['영계의천', trade, 4], ['프로텍터', trade, 4]
    ];
    const rows = raw.map(([name, fx, from], i) => {
      const sel = name === '각성의돌';
      const absent = from > CUR;
      return {
        name, fx, sel, absent, op: absent ? 0.55 : 1,
        bg: sel ? '#FFF4CC' : (i % 2 ? '#FAF7F0' : '#FFFFFF'),
        g: [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => {
          const has = n >= from;
          const cur = n === CUR;
          return {
            bg: has ? '#2A7D38' : '#FFFFFF',
            bd: cur ? '2px solid #F2C12E' : (has ? '1.5px solid #2A2A33' : '1.5px dashed #BDB4A3')
          };
        })
      };
    });
    const selGens = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => ({
      n, bg: n >= 4 ? '#2A7D38' : '#FFFFFF', fg: n === CUR ? '#D8322B' : '#55535C',
      bd: n === CUR ? '3px solid #F2C12E' : (n >= 4 ? '2px solid #2A2A33' : '1.5px dashed #BDB4A3')
    }));
    return { cats, genHead, rows, selGens };
  }
}
</script>
