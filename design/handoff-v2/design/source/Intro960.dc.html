<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>PokeSix 인트로 — 960 최소 창</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&amp;family=Nanum+Gothic:wght@400;700;800&amp;family=Nanum+Gothic+Coding:wght@400;700&amp;family=Silkscreen:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#F3EFE6;color:#22222A;font-family:'Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
a{color:#2C64B0}a:hover{color:#1D4E8F}
</style>
</helmet>
<div style="position: relative; width: 960px; height: 640px; overflow: hidden; box-sizing: border-box; background: repeating-linear-gradient(135deg, #F3EFE6 0px, #F3EFE6 20px, #EFEADF 20px, #EFEADF 40px); font-family: 'Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color: #22222A">

<div style="position: absolute; left: 0; right: 0; top: 0; height: 8px; background: #D8322B; border-bottom: 3px solid #2A2A33"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #D8322B; border-top: 3px solid #2A2A33"></div>

<main style="display: flex; flex-direction: column; align-items: center; padding-top: 22px">
<div style="display: flex; align-items: center; gap: 14px">
<svg width="72" height="72" viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(50 50) scale(1.234) rotate(-35) translate(-50 -50)"><path d="M50 25 L35 25 A25 25 0 0 0 35 75 L50 75 Z" fill="#D8322B"></path><path d="M50 25 L65 25 A25 25 0 0 1 65 75 L50 75 Z" fill="#FFF8EC"></path><rect x="19" y="31" width="18" height="6" rx="3" fill="#FFFFFF" opacity="0.6"></rect><line x1="50" y1="25" x2="50" y2="75" stroke="#2A2A33" stroke-width="4.5"></line><rect x="10" y="25" width="80" height="50" rx="25" fill="none" stroke="#2A2A33" stroke-width="5"></rect><ellipse cx="61" cy="47" rx="4" ry="4.6" fill="#2A2A33"></ellipse><ellipse cx="77" cy="47" rx="4" ry="4.6" fill="#2A2A33"></ellipse><circle cx="62.4" cy="45.2" r="1.4" fill="#FFFFFF"></circle><circle cx="78.4" cy="45.2" r="1.4" fill="#FFFFFF"></circle><path d="M65 55.5 Q69 60 73 55.5" fill="none" stroke="#2A2A33" stroke-width="2.4" stroke-linecap="round"></path></g></svg>
<h1 style="margin: 0; font-family: 'Silkscreen','Courier New',monospace; font-size: 50px; font-weight: 700; line-height: 1; letter-spacing: 0.02em; color: #22222A; text-shadow: 3px 3px 0 #F2C12E">POKE<span style="color: #D8322B">SIX</span></h1>
</div>
<p style="margin: 8px 0 0; font-family: 'Do Hyeon',sans-serif; font-size: 17px; color: #55535C">세대별 정주행을 위한 도감 · 파티 도우미</p>

<div style="position: relative; display: flex; align-items: center; gap: 10px; margin-top: 14px">
<span style="font-size: 12px; font-weight: 700; color: #6B6872">지금 여행 중인 세대</span>
<button onClick="{{toggleGen}}" aria-haspopup="menu" aria-expanded="{{genOpen}}" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 8px; border: 2px solid #2A2A33; background: #FFFFFF; color: #22222A; box-shadow: 0 3px 0 #2A2A33; font-family: 'Do Hyeon',sans-serif; font-size: 18px; cursor: pointer">
<span style="font-family: 'Silkscreen',monospace; font-size: 11px; font-weight: 400; padding: 3px 6px; border-radius: 4px; background: #2A2A33; color: #FFE08A">GEN {{gen.n}}</span>{{gen.region}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{genOpen}}" hint-placeholder-val="{{false}}">
<div role="menu" aria-label="세대 선택" style="position: absolute; top: 46px; right: 0; z-index: 5; width: 260px; display: flex; flex-direction: column; gap: 2px; padding: 6px; box-sizing: border-box; border-radius: 8px; border: 2px solid #2A2A33; background: #FFFFFF; box-shadow: 0 4px 0 #2A2A33">
<sc-for list="{{gens}}" as="g" hint-placeholder-count="9">
<button role="menuitemradio" aria-checked="{{g.cur}}" onClick="{{g.pick}}" style="display: grid; grid-template-columns: 14px 56px 1fr 14px; gap: 8px; align-items: center; height: 30px; padding: 0 8px; border-radius: 5px; border: 0; text-align: left; background: {{g.bg}}; color: #22222A; font-family: 'Do Hyeon',sans-serif; font-size: 16px; cursor: pointer">
<span style="display: flex"><sc-if value="{{g.cur}}" hint-placeholder-val="{{false}}"><span style="width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid #2A2A33"></span></sc-if></span>
<span style="font-family: 'Silkscreen',monospace; font-size: 11px">GEN {{g.n}}</span>{{g.region}}
<sc-if value="{{g.cur}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2A7D38" stroke-width="3.4"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
</button>
</sc-for>
</div>
</sc-if>
</div>

<nav aria-label="메뉴" style="margin-top: 16px; width: 460px; padding: 7px; box-sizing: border-box; border-radius: 12px; border: 3px solid #2A2A33; background: #FFFFFF; box-shadow: 0 5px 0 #2A2A33">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 5px; border-radius: 8px; border: 2px solid #DDD6C8">
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<a href="{{it.href}}" onMouseEnter="{{it.hover}}" style="display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; height: 48px; padding: 0 10px; box-sizing: border-box; border-radius: 7px; text-decoration: none; color: #22222A; border: {{it.bd}}; background: {{it.bg}}">
<span style="display: flex; justify-content: center"><sc-if value="{{it.sel}}" hint-placeholder-val="{{false}}"><span style="width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 10px solid #2A2A33"></span></sc-if></span>
<span style="display: flex; align-items: baseline; gap: 10px"><span style="font-family: 'Do Hyeon',sans-serif; font-size: 22px; line-height: 1.1">{{it.name}}</span><span style="font-size: 12px; color: #55535C">{{it.desc}}</span></span>
<span style="display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; box-sizing: border-box; border-radius: 5px; border: 2px solid #2A2A33; background: {{it.kb}}; font-family: 'Silkscreen',monospace; font-size: 11px">{{it.key}}</span>
</a>
</sc-for>
<div style="height: 0; margin: 3px 8px; border-top: 2px dashed #DDD6C8"></div>
<button onMouseEnter="{{quitHover}}" style="display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; height: 36px; padding: 0 10px; box-sizing: border-box; border-radius: 7px; text-align: left; color: #55535C; font-family: 'Do Hyeon',sans-serif; font-size: 18px; cursor: pointer; border: {{quit.bd}}; background: {{quit.bg}}">
<span style="display: flex; justify-content: center"><sc-if value="{{quit.sel}}" hint-placeholder-val="{{false}}"><span style="width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid #2A2A33"></span></sc-if></span>종료<span style="font-family: 'Nanum Gothic Coding',monospace; font-size: 11px; color: #6B6872">Esc</span></button>
</div>
</nav>
</main>

<footer style="position: absolute; left: 20px; right: 20px; bottom: 16px; display: flex; align-items: center; font-size: 11px; color: #55535C">
<span style="font-family: 'Nanum Gothic Coding',monospace; font-weight: 700">v0.1.0</span>
<span style="margin-left: auto">데이터: PokéAPI · 비공식 팬 도구</span>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 0, gen: 4, genOpen: false }; }
  renderVals() {
    const R = ['관동', '성도', '호연', '신오', '하나', '칼로스', '알로라', '가라르', '팔데아'];
    const M = [
      ['도감 대백과', '종족값 · 상성 · 기술', 'DexCompact.dc.html'],
      ['아이템 대백과', '회복 · 기술머신 · 진화', 'Items.dc.html'],
      ['SixSquad', '파티 편성과 타입 분석', 'SquadCompact.dc.html'],
      ['설정', '세대 규칙 · 데이터 · 테마', 'Settings.dc.html']
    ];
    const s = this.state;
    const row = (on) => on
      ? { sel: true, bd: '2px solid #2A2A33', bg: '#FFF4CC', kb: '#F2C12E' }
      : { sel: false, bd: '2px solid transparent', bg: 'transparent', kb: '#FFFFFF' };
    const items = M.map(([name, desc, href], i) => ({ name, desc, href, key: String(i + 1), ...row(s.sel === i), hover: () => this.setState({ sel: i }) }));
    const gens = R.map((region, i) => ({ n: i + 1, region, cur: s.gen === i + 1, bg: s.gen === i + 1 ? '#FFF4CC' : 'transparent', pick: () => this.setState({ gen: i + 1, genOpen: false }) }));
    return {
      items, gens, genOpen: s.genOpen, gen: { n: s.gen, region: R[s.gen - 1] },
      quit: row(s.sel === 4), quitHover: () => this.setState({ sel: 4 }),
      toggleGen: () => this.setState({ genOpen: !s.genOpen })
    };
  }
}
</script>
</body>
</html>
