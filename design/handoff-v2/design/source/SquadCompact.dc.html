<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#D8322B" stroke-width="3"><path d="M12 4l9 16H3z"></path><path d="M12 10v4"></path></svg>
문제 3 — 땅 약점 3 · 얼음 ×4 · 고스트 공격 없음

<span></span>
<sc-for list="{{head}}" as="h" hint-placeholder-count="18"><span style="display: flex; align-items: center; justify-content: center; height: 22px; box-sizing: border-box; border-radius: 4px; font-size: 11px; font-weight: 800; background: {{h.fill}}; color: {{h.fg}}; border: {{h.bd}}">{{h.a}}</span></sc-for>

<span style="display: flex; align-items: center; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 3px; font-size: 11px; font-weight: 800; white-space: nowrap; overflow: hidden; background: {{r.lb}}; color: {{r.lc}}">{{r.name}}</span>
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="18"><span style="display: flex; align-items: center; justify-content: center; height: 22px; box-sizing: border-box; border-radius: 3px; border: 1px solid #E4DDCF; font-family: 'Nanum Gothic Coding',monospace; font-size: 12px; background: {{c.bg}}; color: {{c.fg}}; font-weight: {{c.fw}}">{{c.t}}</span></sc-for>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    const TT = {
      '노말': ['노','#BDBBA6','#2A2A33'], '불꽃': ['불','#CC4A22','#FFFFFF'], '물': ['물','#3470C2','#FFFFFF'],
      '풀': ['풀','#377D33','#FFFFFF'], '전기': ['전','#F2C12E','#2A2A33'], '얼음': ['얼','#7FCFD4','#2A2A33'],
      '격투': ['격','#A8332A','#FFFFFF'], '독': ['독','#8A3F96','#FFFFFF'], '땅': ['땅','#D8B062','#2A2A33'],
      '비행': ['비','#A3AEEF','#2A2A33'], '에스퍼': ['에','#C93866','#FFFFFF'], '벌레': ['벌','#A9BA3A','#2A2A33'],
      '바위': ['바','#806C30','#FFFFFF'], '고스트': ['고','#5B4A8C','#FFFFFF'], '드래곤': ['드','#4B42C4','#FFFFFF'],
      '악': ['악','#4A3F38','#FFFFFF'], '강철': ['강','#B5C0CC','#2A2A33'], '페어리': ['페','#EFA6CF','#2A2A33']
    };
    const ORDER = Object.keys(TT);
    const mv = (n, t) => n ? { n, fill: TT[t][1], sq: '#2A2A33', bd: '1.5px solid #DDD6C8', fc: '#22222A' } : { n: '+ 기술', fill: 'transparent', sq: 'transparent', bd: '1.5px dashed #9A96A0', fc: '#6B6872' };
    const data = [
      ['초염몽', ['불꽃', '격투'], [mv('화염방사', '불꽃'), mv('인파이트', '격투'), mv('유턴', '벌레'), mv('마하펀치', '격투')], [1, .5, 2, .5, 1, .5, 1, 1, 2, 2, 2, .25, 1, 1, 1, .5, .5, null]],
      ['엠페르트', ['물', '강철'], [mv('파도타기', '물'), mv('냉동빔', '얼음'), mv('러스트캐논', '강철'), mv('그라스믹서', '풀')], [.5, 1, .5, 1, 2, .25, 2, 0, 2, .5, .5, .5, .5, .5, .5, .5, .25, null]],
      ['한카리아스', ['드래곤', '땅'], [mv('지진', '땅'), mv('역린', '드래곤'), mv('스톤에지', '바위'), mv('칼춤', '노말')], [1, .5, 1, 1, 0, 4, 1, .5, 1, 1, 1, 1, .5, 1, 2, 1, 1, null]],
      ['렌트라', ['전기'], [mv('스파크', '전기'), mv('몸통박치기', '노말'), mv('째려보기', '노말'), mv()], [1, 1, 1, 1, .5, 1, 1, 1, 2, .5, 1, 1, 1, 1, 1, 1, .5, null]],
      ['토게키스', ['노말', '비행'], [mv('에어슬래시', '비행'), mv('파동탄', '격투'), mv('원시의힘', '바위'), mv('전기자석파', '전기')], [1, 1, 1, .5, 2, 2, 1, 1, 0, 1, 1, .5, 2, 0, 1, 1, 1, null]]
    ];
    const SEL = 2;
    const members = data.map(([name, types, moves, m], i) => {
      const weak = [];
      m.forEach((x, j) => { if (x && x > 1) { const n = ORDER[j]; weak.push(x >= 4 ? { a: TT[n][0] + '×4', fill: '#D8322B', fg: '#FFFFFF' } : { a: TT[n][0], fill: TT[n][1], fg: TT[n][2] }); } });
      const lead = TT[types[0]];
      return { no: '0' + (i + 1), name, moves, weak, sel: i === SEL, hf: lead[1], hc: lead[2], ol: i === SEL ? '4px solid #F2C12E' : '0px solid transparent',
        types: types.map((n) => ({ a: TT[n][0], fill: TT[n][1], fg: TT[n][2] })) };
    });
    const cell = (x) => {
      if (x === null) return { t: '—', bg: 'repeating-linear-gradient(135deg, #EFEAE0 0px, #EFEAE0 3px, #FFFFFF 3px, #FFFFFF 6px)', fg: '#9A96A0', fw: 400 };
      if (x >= 4) return { t: '4', bg: '#D8322B', fg: '#FFFFFF', fw: 700 };
      if (x >= 2) return { t: '2', bg: '#F9CFC9', fg: '#8E1C16', fw: 700 };
      if (x === 1) return { t: '', bg: '#FFFFFF', fg: '#22222A', fw: 400 };
      if (x === 0) return { t: '0', bg: '#2A2A33', fg: '#FFFFFF', fw: 700 };
      if (x <= 0.25) return { t: '¼', bg: '#2C64B0', fg: '#FFFFFF', fw: 700 };
      return { t: '½', bg: '#D3E3F7', fg: '#1D4E8F', fw: 700 };
    };
    const head = ORDER.map((n, j) => j === 17
      ? { a: TT[n][0], fill: '#FFFFFF', fg: '#9A96A0', bd: '1.5px dashed #9A96A0' }
      : j === 8 ? { a: TT[n][0], fill: TT[n][1], fg: TT[n][2], bd: '3px solid #D8322B' }
      : { a: TT[n][0], fill: TT[n][1], fg: TT[n][2], bd: '1.5px solid #2A2A33' });
    const rows = data.map(([name, , , m], i) => ({ name, lb: i === SEL ? '#FFF4CC' : 'transparent', lc: '#22222A', cells: m.map(cell) }));
    const weakN = ORDER.map((_, j) => j === 17 ? null : data.filter((d) => d[3][j] > 1).length);
    rows.push({ name: '약점 수', lb: 'transparent', lc: '#55535C', cells: weakN.map((n) => n === null ? { t: '—', bg: 'transparent', fg: '#9A96A0', fw: 400 } : n >= 3 ? { t: String(n), bg: '#D8322B', fg: '#FFFFFF', fw: 700 } : n === 2 ? { t: '2', bg: '#F9CFC9', fg: '#8E1C16', fw: 700 } : { t: String(n), bg: 'transparent', fg: n ? '#22222A' : '#9A96A0', fw: 700 }) });
    return { members, head, rows };
  }
}
</script>
