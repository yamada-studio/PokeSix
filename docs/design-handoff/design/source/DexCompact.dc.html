<span style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); text-align: right; font-family: 'Nanum Gothic Coding',monospace; font-size: 12px"><sc-for list="{{r.st}}" as="s" hint-placeholder-count="6"><span>{{s}}</span></sc-for></span>

</div>

<span style="display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 8px; border-radius: 5px; border: 2px solid #2A2A33; background: #F9CFC9; color: #8E1C16; font-size: 12px; font-weight: 800">×2 드래곤</span>

<span style="display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 8px; border-radius: 5px; border: 2px solid #2A2A33; background: #2A2A33; color: #FFFFFF; font-size: 12px; font-weight: 800">×0 전기</span>

<button role="tab" aria-selected="false" style="height: 30px; padding: 0 12px; border-radius: 5px 5px 0 0; border: 0; background: #EFEAE0; color: #55535C; font-family: 'Do Hyeon',sans-serif; font-size: 15px">교배</button>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    const TT = {
      '노말': ['#BDBBA6','#2A2A33'], '불꽃': ['#CC4A22','#FFFFFF'], '물': ['#3470C2','#FFFFFF'], '풀': ['#377D33','#FFFFFF'],
      '전기': ['#F2C12E','#2A2A33'], '얼음': ['#7FCFD4','#2A2A33'], '격투': ['#A8332A','#FFFFFF'], '땅': ['#D8B062','#2A2A33'],
      '비행': ['#A3AEEF','#2A2A33'], '바위': ['#806C30','#FFFFFF'], '드래곤': ['#4B42C4','#FFFFFF'], '강철': ['#B5C0CC','#2A2A33']
    };
    const chip = (n) => ({ name: n, fill: TT[n][0], fg: TT[n][1] });
    const chips = [{ t: 'GEN 4' }, { t: '합계 500+' }, { t: '전설 제외' }];
    const raw = [
      ['445', '한카리아스', ['드래곤', '땅'], [108, 130, 95, 80, 85, 102]],
      ['468', '토게키스', ['노말', '비행'], [85, 50, 95, 120, 115, 80]],
      ['466', '에레키블', ['전기'], [75, 123, 67, 95, 85, 95]],
      ['467', '마그마번', ['불꽃'], [75, 95, 67, 125, 95, 83]],
      ['462', '자포코일', ['전기', '강철'], [70, 70, 115, 130, 90, 60]],
      ['464', '거대코뿌리', ['땅', '바위'], [115, 140, 130, 55, 55, 40]],
      ['465', '덩쿠림보', ['풀'], [100, 100, 125, 110, 50, 50]],
      ['474', '폴리곤Z', ['노말'], [85, 80, 70, 135, 75, 90]],
      ['392', '초염몽', ['불꽃', '격투'], [76, 104, 71, 104, 71, 108]],
      ['395', '엠페르트', ['물', '강철'], [84, 86, 88, 111, 101, 60]],
      ['473', '맘모꾸리', ['얼음', '땅'], [110, 130, 80, 70, 60, 80]],
      ['389', '토대부기', ['풀', '땅'], [95, 109, 105, 75, 85, 56]],
      ['448', '루카리오', ['격투', '강철'], [70, 110, 70, 115, 70, 90]],
      ['470', '리피아', ['풀'], [65, 110, 130, 60, 65, 95]],
      ['471', '글레이시아', ['얼음'], [65, 60, 110, 130, 95, 65]],
      ['450', '하마돈', ['땅'], [108, 112, 118, 68, 72, 47]]
    ];
    const rows = raw.map(([dex, name, ty, st], i) => {
      const total = st.reduce((a, b) => a + b, 0);
      return { dex, name, total, st, sel: i === 0, types: ty.map(chip), tc: total >= 600 ? '#D8322B' : '#22222A', bg: i === 0 ? '#FFF4CC' : (i % 2 ? '#FAF7F0' : '#FFFFFF') };
    });
    const fc = (v) => v >= 120 ? '#2C64B0' : v >= 90 ? '#5DAE45' : v >= 60 ? '#F2C12E' : '#E86A4F';
    const stats = [['HP', 108], ['공격', 130], ['방어', 95], ['특공', 80], ['특방', 85], ['스피드', 102]].map(([k, v]) => ({ k, v, fc: fc(v), w: (v / 255 * 100).toFixed(1) + '%' }));
    return { chips, rows, stats };
  }
}
</script>
